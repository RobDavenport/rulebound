[workspace]
members = ["demo-wasm"]
resolver = "3"

[package]
name = "rulebound"
version = "0.1.0"
edition = "2024"
description = "A lightweight, no_std constraint propagation solver for real-time game logic and procedural verification"
license = "MIT OR Apache-2.0"

[lib]
name = "rulebound"
path = "src/lib.rs"

[features]
default = []
std = []

[dependencies]
rand_core = { version = "0.6", default-features = false }

[dev-dependencies]
rand = { version = "0.8", features = ["small_rng"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "propagation"
harness = false
